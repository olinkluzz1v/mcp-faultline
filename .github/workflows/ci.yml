# .github/workflows/ci.yml
#
# Continuous integration for MCP-Faultline.
#
# Runs the full test suite on every push and pull request:
#   1. Type-check (tsc --noEmit)
#   2. Build (tsc)
#   3. Proxy smoke and MCP protocol integration tests
#   4. Integrity smoke
#   5. Idempotency smoke
#   6. Embedded tool results and replay tests
#   7. Reporting tests
#   8. Guided local demo tests
#   9. Run CLI exit codes and interruption tests
#  10. Codex ticket single-run and batch examples (offline scripted controls only)
#  11. Embedded run (produce report)
#  12. Negative controls (oracle validation)
#  13. Replay (reproducibility)
#
# Pure Node — no Docker, no Homebrew, no external services.
# Live models and authentication are never used by these checks.

name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

# Cancel in-progress runs for the same branch when a new commit lands.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node 20 — full suite
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Build
        run: npx tsc

      - name: Proxy smoke
        run: npm run test:proxy-smoke

      - name: MCP proxy protocol integration
        run: npm run test:proxy

      - name: Integrity smoke
        run: npm run test:integrity-smoke

      - name: Idempotency smoke
        run: npm run test:idempotency-smoke

      - name: Embedded tool results and replay
        run: npm run test:agent

      - name: Report statistics and output
        run: npm run test:report

      - name: Guided local demo
        run: npm run test:demo

      - name: Run CLI exit codes and interruption
        run: npm run test:run

      - name: Codex ticket example (offline scripted controls)
        run: npm run test:codex-ticket

      - name: Codex ticket batch (offline scripted controls)
        run: npm run test:codex-ticket-batch

      - name: Embedded run (produce report)
        run: node dist/cli.js run

      - name: Negative controls (oracle validation)
        run: node dist/cli.js negative-controls

      - name: Replay (reproducibility)
        run: node dist/cli.js replay reports/report.json

      - name: Upload report artifacts
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: faultline-report
          path: |
            reports/report.json
            reports/report.md
            reports/report.html
          if-no-files-found: ignore
          retention-days: 7
